<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Photoreal-style Mars texture">
  <defs>
    <radialGradient id="base" cx="36%" cy="30%" r="74%">
      <stop offset="0%" stop-color="#ffd2cc"/>
      <stop offset="24%" stop-color="#ef7e73"/>
      <stop offset="56%" stop-color="#c33f48"/>
      <stop offset="84%" stop-color="#7a1d2e"/>
      <stop offset="100%" stop-color="#28070f"/>
    </radialGradient>

    <radialGradient id="polarHaze" cx="50%" cy="8%" r="46%">
      <stop offset="0%" stop-color="#ffe6df" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffe6df" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="terminator" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="56%" stop-color="#160209" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#070103" stop-opacity="0.56"/>
    </linearGradient>

    <filter id="terrainNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="4" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0.72 0 0 0 0.16  0 0.28 0 0 0.02  0 0 0.22 0 0.02  0 0 0 1 0" result="albedo"/>
      <feGaussianBlur in="albedo" stdDeviation="0.6"/>
    </filter>

    <filter id="dustNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.017" numOctaves="3" seed="17" result="storm"/>
      <feColorMatrix in="storm" type="matrix" values="1 0 0 0 0  0 0.62 0 0 0  0 0 0.42 0 0  0 0 0 1 0"/>
    </filter>

    <filter id="softCrater" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>

    <clipPath id="planetClip">
      <circle cx="256" cy="256" r="244"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="244" fill="url(#base)"/>

  <g clip-path="url(#planetClip)">
    <rect x="0" y="0" width="512" height="512" filter="url(#terrainNoise)" opacity="0.55"/>

    <ellipse cx="266" cy="150" rx="212" ry="58" fill="#f39a83" opacity="0.18" transform="rotate(-9 266 150)"/>
    <ellipse cx="246" cy="250" rx="228" ry="64" fill="#e36c5d" opacity="0.16" transform="rotate(7 246 250)"/>
    <ellipse cx="282" cy="354" rx="178" ry="48" fill="#f08b78" opacity="0.15" transform="rotate(-8 282 354)"/>

    <ellipse cx="178" cy="172" rx="64" ry="46" fill="#6a1929" opacity="0.48" filter="url(#softCrater)"/>
    <ellipse cx="346" cy="194" rx="74" ry="52" fill="#5c1124" opacity="0.45" filter="url(#softCrater)"/>
    <ellipse cx="304" cy="306" rx="78" ry="58" fill="#5b1024" opacity="0.42" filter="url(#softCrater)"/>
    <ellipse cx="174" cy="322" rx="56" ry="38" fill="#4f0d1f" opacity="0.42" filter="url(#softCrater)"/>
    <ellipse cx="410" cy="286" rx="40" ry="28" fill="#571028" opacity="0.42" filter="url(#softCrater)"/>

    <ellipse cx="174" cy="162" rx="46" ry="32" fill="#ffb09e" opacity="0.21"/>
    <ellipse cx="332" cy="232" rx="54" ry="34" fill="#fda091" opacity="0.18"/>
    <ellipse cx="272" cy="324" rx="60" ry="36" fill="#f48e82" opacity="0.15"/>

    <rect x="0" y="0" width="512" height="512" filter="url(#dustNoise)" opacity="0.18"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#terminator)"/>
  </g>

  <circle cx="256" cy="256" r="244" fill="none" stroke="#f17a7e" stroke-opacity="0.42" stroke-width="5"/>
  <ellipse cx="190" cy="138" rx="82" ry="52" fill="#ffe2da" opacity="0.18"/>
  <ellipse cx="256" cy="74" rx="130" ry="44" fill="url(#polarHaze)"/>
</svg>
