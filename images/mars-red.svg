<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Red moon texture">
  <defs>
    <radialGradient id="moonBase" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffd7d7"/>
      <stop offset="26%" stop-color="#ff8a8a"/>
      <stop offset="58%" stop-color="#d93636"/>
      <stop offset="84%" stop-color="#8f1515"/>
      <stop offset="100%" stop-color="#330707"/>
    </radialGradient>

    <radialGradient id="moonHaze" cx="50%" cy="10%" r="44%">
      <stop offset="0%" stop-color="#fff1f1" stop-opacity="0.58"/>
      <stop offset="100%" stop-color="#fff1f1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="nightTerminator" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="54%" stop-color="#040b05" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020502" stop-opacity="0.6"/>
    </linearGradient>

    <filter id="moonNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="14" result="grain"/>
      <feColorMatrix in="grain" type="matrix" values="0.78 0 0 0 0.12  0 0.24 0 0 0.02  0 0 0.24 0 0.02  0 0 0 1 0" result="tinted"/>
      <feGaussianBlur in="tinted" stdDeviation="0.7"/>
    </filter>

    <filter id="softCrater" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>

    <clipPath id="moonClip">
      <circle cx="256" cy="256" r="244"/>
    </clipPath>
  </defs>

  <circle cx="256" cy="256" r="244" fill="url(#moonBase)"/>

  <g clip-path="url(#moonClip)">
    <rect x="0" y="0" width="512" height="512" filter="url(#moonNoise)" opacity="0.58"/>

    <ellipse cx="250" cy="146" rx="196" ry="56" fill="#ffd0d0" opacity="0.18" transform="rotate(-8 250 146)"/>
    <ellipse cx="252" cy="252" rx="222" ry="64" fill="#ff8b8b" opacity="0.14" transform="rotate(6 252 252)"/>
    <ellipse cx="286" cy="352" rx="166" ry="46" fill="#ffb1b1" opacity="0.12" transform="rotate(-9 286 352)"/>

    <ellipse cx="178" cy="172" rx="68" ry="48" fill="#561010" opacity="0.46" filter="url(#softCrater)"/>
    <ellipse cx="344" cy="194" rx="76" ry="54" fill="#4b0d0d" opacity="0.43" filter="url(#softCrater)"/>
    <ellipse cx="304" cy="308" rx="80" ry="58" fill="#430b0b" opacity="0.42" filter="url(#softCrater)"/>
    <ellipse cx="170" cy="324" rx="58" ry="40" fill="#4c0c0c" opacity="0.4" filter="url(#softCrater)"/>
    <ellipse cx="410" cy="286" rx="42" ry="30" fill="#430b0b" opacity="0.4" filter="url(#softCrater)"/>

    <ellipse cx="176" cy="164" rx="48" ry="33" fill="#ffdede" opacity="0.18"/>
    <ellipse cx="334" cy="236" rx="55" ry="35" fill="#ffcaca" opacity="0.15"/>
    <ellipse cx="270" cy="324" rx="60" ry="36" fill="#ffb7b7" opacity="0.12"/>

    <rect x="0" y="0" width="512" height="512" fill="url(#nightTerminator)"/>
  </g>

  <circle cx="256" cy="256" r="244" fill="none" stroke="#ff6a6a" stroke-opacity="0.42" stroke-width="5"/>
  <ellipse cx="192" cy="138" rx="80" ry="50" fill="#fff2f2" opacity="0.16"/>
  <ellipse cx="256" cy="76" rx="128" ry="42" fill="url(#moonHaze)"/>
</svg>
